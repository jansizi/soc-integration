<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-theme-red { color: #8B0000; }
        .border-theme-red { border-color: #8B0000; }
    </style>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

    <nav class="w-64 bg-gray-900 text-white flex flex-col shadow-lg transition-all duration-300">
        
        <div class="h-16 flex items-center justify-center border-b border-gray-700 bg-gray-800">
            <h1 class="text-xl font-bold tracking-wider text-blue-400">SOC MONITOR</h1>
        </div>

        <div class="flex-1 overflow-y-auto py-4">
            <ul class="space-y-1">
                <li>
                    <a href="/" class="flex items-center px-6 py-3 {{ if eq .active "dashboard" }}bg-gray-800 text-white border-blue-500{{ else }}text-gray-300 hover:bg-gray-800 hover:text-white border-transparent hover:border-blue-500{{ end }} border-l-4 transition-colors">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="/alerts" class="flex items-center px-6 py-3 {{ if eq .active "incidents" }}bg-gray-800 text-white border-red-500{{ else }}text-gray-300 hover:bg-gray-800 hover:text-white border-transparent hover:border-red-500{{ end }} border-l-4 transition-colors">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        incidents
                    </a>
                </li>
            </ul>
        </div>

        <div class="p-4 border-t border-gray-700 bg-gray-800">
            <div class="flex items-center">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold">
                    A
                </div>
                <div class="ml-3">
                    <p class="text-sm font-medium text-white">Admin User</p>
                    <p class="text-xs text-gray-400">View Profile</p>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-1 flex flex-col overflow-hidden">
        {{template "content" .}}
    </div>

    <script>

    </script>
    {{block "scripts" .}}{{end}}
</body>
</html>
