{{define "pagination"}}
{{if .}}
<nav aria-label="Page navigation">
    <ul class="pagination justify-content-center mb-0">
        <!-- Previous -->
        <li class="page-item {{if not .HasPrev}}disabled{{end}}">
            <a class="page-link" href="?page={{.PrevPage}}" {{if not .HasPrev}}tabindex="-1" aria-disabled="true"{{end}}>Previous</a>
        </li>

        <!-- Page Numbers -->
        {{range .Pages}}
        <li class="page-item {{if eq . $.CurrentPage}}active{{end}}">
            <a class="page-link" href="?page={{.}}">{{.}}</a>
        </li>
        {{end}}

        <!-- Next -->
        <li class="page-item {{if not .HasNext}}disabled{{end}}">
            <a class="page-link" href="?page={{.NextPage}}" {{if not .HasNext}}tabindex="-1" aria-disabled="true"{{end}}>Next</a>
        </li>
    </ul>
</nav>
{{end}}
{{end}}
