{{define "content"}}
<div class="container-fluid p-4">
    <header class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h1 class="page-title" id="main-page-title">DASHBOARD</h1>
    </header>

    <div class="card-modern mb-4">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark" id="table-title">Endpoint Status</h5>
                <ul class="nav nav-tabs nav-tabs-modern card-header-tabs" id="dashboardTabs">
                    <li class="nav-item">
                        <button onclick="switchTab('endpoint')" id="tab-endpoint" class="nav-link active" aria-current="true">
                            <i class="fa-solid fa-desktop me-1"></i> Endpoint Status
                        </button>
                    </li>
                    <li class="nav-item">
                        <button onclick="switchTab('alert')" id="tab-alert" class="nav-link">
                            <i class="fa-solid fa-bell me-1"></i> Alert Monitor
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="card-body">
            <div class="row g-4">
                <!-- Chart Section -->
                <div class="col-md-4 text-center position-relative">
                    <div style="height: 250px; position: relative;">
                        <canvas id="mainChart"></canvas>
                        <div class="position-absolute top-50 start-50 translate-middle text-center" style="pointer-events: none;">
                            <div class="h2 fw-bold mb-0" id="center-number">95%</div>
                            <div class="small text-muted text-uppercase" id="center-label">Online</div>
                        </div>
                    </div>
                </div>
                
                <!-- Summary Cards -->
                <div class="col-md-8">
                    <div class="row g-3" id="summary-cards">
                        <!-- Cards will be injected here by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filter Section -->
    <div class="card-modern mb-4">
        <div class="card-body d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div class="d-flex flex-wrap gap-3 align-items-end">
                <div>
                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">From</label>
                    <input type="datetime-local" class="form-control form-control-sm">
                </div>
                <div>
                    <label class="form-label small fw-bold text-muted text-uppercase mb-1">To</label>
                    <input type="datetime-local" class="form-control form-control-sm">
                </div>
                <button class="btn btn-dark btn-sm">
                    <i class="fa-solid fa-filter me-1"></i> Filter
                </button>
            </div>
            <button onclick="exportReport()" class="btn btn-success btn-sm">
                <i class="fa-solid fa-file-export me-1"></i> Export Report
            </button>
        </div>
    </div>

    <!-- Table Section -->
    <div class="card-modern">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-bold text-secondary">Endpoint History</h6>
            <span class="badge badge-soft-dark">Showing latest 5 records</span>
        </div>
        <div class="table-responsive">
            <table class="table table-modern mb-0 align-middle">
                <thead>
                    <tr id="table-header">
                        <!-- Header injected by JS -->
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Body injected by JS -->
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-end gap-2">
            <button class="btn btn-sm btn-outline-secondary">Previous</button>
            <button class="btn btn-sm btn-outline-secondary">Next</button>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
 <script>
    function switchTab(tabName) {
        const btnEnd = document.getElementById('tab-endpoint');
        const btnAlert = document.getElementById('tab-alert');
        
        if (tabName === 'endpoint') {
            btnEnd.classList.add('active');
            
            btnAlert.classList.remove('active');
            
            document.getElementById('table-title').innerText = "Endpoint Status";
            if(typeof endpointData !== 'undefined') {
                initChart(endpointData.chart);
                document.getElementById('center-number').innerText = endpointData.centerText;
                document.getElementById('center-label').innerText = endpointData.centerLabel;
                renderCards(endpointData.cards);
                renderTable(endpointData.tableHeader, endpointData.tableRows);
            }

        } else {
            btnAlert.classList.add('active');

            btnEnd.classList.remove('active');

            document.getElementById('table-title').innerText = "Alert Monitor";
            if(typeof alertData !== 'undefined') {
                initChart(alertData.chart);
                document.getElementById('center-number').innerText = alertData.centerText;
                document.getElementById('center-label').innerText = alertData.centerLabel;
                renderCards(alertData.cards);
                renderTable(alertData.tableHeader, alertData.tableRows);
            }
        }
    }
 </script>
{{end}}
